name: 🐛 Bug 报告
description: 创建一个 bug 报告，以帮助修复问题
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 描述
      description: 清晰简洁地描述这个 bug 是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 复现行为的步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 清晰简洁地描述你期望发生的事情
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果适用，添加截图来帮助解释你的问题
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 提供您的操作系统等信息
  - type: textarea
    id: logs
    attributes:
      label: 日志信息
      description: 如果可能，请附上相关日志
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: 额外信息
      description: 在此添加关于该问题的任何其他背景信息
